server {
    listen 80;
    server_name simpledevutils.com www.simpledevutils.com;

    root /var/www/simpledevutils;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────
    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Content Security Policy — self-only, inline styles allowed (CSS vars)
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    # Don't leak full referrer to third parties
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disable browser features we don't use
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    # Force HTTPS — Cloudflare handles TLS but this ensures the browser always upgrades
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent cross-origin data leaks
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # ── Custom error pages ─────────────────────────────────────────
    error_page 404 /404.html;
    error_page 405 /405.html;

    # Disable etag (can leak inode information)
    etag off;

    # ── Request hardening ────────────────────────────────────────────
    # Limit request body size (static site — no uploads expected)
    client_max_body_size 1k;

    # Only allow GET and HEAD — no reason for POST/PUT/DELETE on a static site
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # ── Serve static files ────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # Disable access to hidden files (.git, .env, etc.)
    location ~ /\. {
        return 404;
    }

    # Cache static assets (security headers are re-declared because nginx
    # does NOT inherit server-level add_header into blocks that set their own)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Gzip compression
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1000;

    # Disable server version disclosure
    server_tokens off;
}
