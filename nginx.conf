server {
    listen 80;
    server_name simpledevutils.com www.simpledevutils.com;

    root /var/www/simpledevutils;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────
    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Content Security Policy — self-only, inline styles allowed (CSS vars)
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    # Don't leak full referrer to third parties
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disable browser features we don't use
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    # Force HTTPS — Cloudflare handles TLS but this ensures the browser always upgrades
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent cross-origin data leaks
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # ── Serve static files ────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # Disable access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1000;

    # Disable server version disclosure
    server_tokens off;
}
