<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found — SimpleDevUtils</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .error-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 2rem;
    }
    .error-cat {
      font-size: 8rem;
      line-height: 1;
      margin-bottom: 1rem;
      filter: grayscale(0.2);
    }
    .error-code {
      font-family: var(--mono);
      font-size: 4rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }
    .error-msg {
      font-size: 1.25rem;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }
    .error-sub {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-bottom: 2rem;
      font-style: italic;
    }
    .error-home {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: var(--radius);
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .error-home:hover { opacity: 0.85; }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="container">
      <div class="nav__inner">
        <a href="/" class="logo">
          <span class="logo__icon">&lt;/&gt;</span>
          SimpleDevUtils
        </a>
      </div>
    </div>
  </nav>

  <main class="error-page">
    <div class="error-cat" aria-hidden="true">🐱</div>
    <div class="error-code">404</div>
    <p class="error-msg">This page has been knocked off the table.</p>
    <p class="error-sub">— The cat probably did it.</p>
    <a href="/" class="error-home">Back to safety</a>
  </main>

  <script src="/js/theme.js"></script>
</body>
</html>
