<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimpleDevUtils — Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0f14;
      color: #e2e4ec;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 48px;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .logo__icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #fff;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .gradient-text {
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      margin-top: 20px;
      color: #6b7280;
      font-size: 1.05rem;
      max-width: 400px;
    }

    .waitlist-form {
      margin-top: 40px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .waitlist-form input[type="email"] {
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #2a2d3a;
      background: #161820;
      color: #e2e4ec;
      font-size: 0.95rem;
      width: 260px;
      outline: none;
    }

    .waitlist-form input[type="email"]::placeholder { color: #4b5060; }
    .waitlist-form input[type="email"]:focus { border-color: #6366f1; }

    .waitlist-form button {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .waitlist-form button:disabled { opacity: 0.6; cursor: default; }

    .form-note {
      margin-top: 12px;
      font-size: 0.8rem;
      color: #4b5060;
    }
  </style>
</head>
<body>
  <div class="logo">
    <span class="logo__icon">&lt;/&gt;</span>
    SimpleDevUtils
  </div>
  <h1>Something cool is<br /><span class="gradient-text">coming soon.</span></h1>
  <p>Developer tools, simplified. We're putting the finishing touches on things.</p>
  <form class="waitlist-form" id="waitlist-form">
    <input type="email" id="email-input" placeholder="you@example.com" required />
    <button type="submit">Get Early Access</button>
  </form>
  <p class="form-note" id="form-message">No spam. Just a heads-up when we launch.</p>
  <script src="main.js"></script>
</body>
</html>
